# This deploys the browser demo in web/.
#
# `web/build.py` builds an mphot wheel from the source tree. It also copies the
# response curves next to the page. `web/` is then a complete site on its own,
# and nothing else in the repository is deployed.

[build]
  command = "python web/build.py"
  publish = "web"

[build.environment]
  # mphot needs Python 3.11 or later. The build image default is older.
  PYTHON_VERSION = "3.11"

# The page reads Gaia DR3 through these proxies. The browser blocks a direct
# request to either archive: VizieR sends Access-Control-Allow-Origin twice,
# and ESA sends none. A request to the page's own origin needs no CORS header.
# Netlify passes the query string through.
[[redirects]]
  from = "/tap/vizier/*"
  to = "https://tapvizier.cds.unistra.fr/TAPVizieR/tap/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tap/esa/*"
  to = "https://gea.esac.esa.int/tap-server/tap/:splat"
  status = 200
  force = true

# A wheel name holds the project version, so the file never changes.
[[headers]]
  for = "/dist/*.whl"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest names the current wheel and holds a content hash for every
# resource. A stale copy would break the page, so it is the one file that is
# always revalidated.
[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-cache"

# The page asks for each resource as `<path>?v=<hash from build.json>`, so its
# address changes whenever its contents do. A stale copy can never be used.
[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The icon and the share image change only when the page does.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Crawlers should always read the current copy of these.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"
